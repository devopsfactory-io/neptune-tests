# Triggered by the Neptune GitHub App (neptbot) via repository_dispatch.
# With repository.automerge: true, Neptune enables PR auto-merge after successful apply.
#
# Dual-mode binary installation:
#   - Normal (webhook): downloads the latest released Neptune binary
#   - CI testing: if the PR description contains "neptune-ref: <SHA>",
#     clones Neptune at that SHA and builds from source (no Lambda changes needed)
name: neptune

on:
  repository_dispatch:
    types: [neptune-command]

concurrency:
  group: neptune
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  neptune:
    runs-on: [self-hosted, medium]  # Private repo; switch to ubuntu-latest when public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: refs/pull/${{ github.event.client_payload.pull_request_number }}/head

      # Check PR description for a neptune-ref override (used by Neptune CI tests)
      - name: Check for Neptune ref override
        id: neptune-ref
        run: |
          NEPTUNE_REF=$(gh pr view "${{ github.event.client_payload.pull_request_number }}" \
            --json body --jq '.body' | grep -oP 'neptune-ref:\s*\K\S+' || echo "")
          echo "ref=$NEPTUNE_REF" >> "$GITHUB_OUTPUT"
          if [ -n "$NEPTUNE_REF" ]; then
            echo "Building Neptune from source at ref: $NEPTUNE_REF"
          else
            echo "Using released Neptune binary"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Mode A: Released binary (normal webhook flow) ---
      - name: Install Neptune (release)
        if: steps.neptune-ref.outputs.ref == ''
        run: |
          NEPTUNE_VERSION="v0.2.0"
          curl -sSL "https://github.com/devopsfactory-io/neptune/releases/download/${NEPTUNE_VERSION}/neptune_${NEPTUNE_VERSION}_linux_amd64.tar.gz" \
            | tar -xz -C /usr/local/bin neptune

      # --- Mode B: Build from source (Neptune CI testing) ---
      - name: Setup Go (CI testing)
        if: steps.neptune-ref.outputs.ref != ''
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Build Neptune from source (CI testing)
        if: steps.neptune-ref.outputs.ref != ''
        run: |
          git init /tmp/neptune-src && cd /tmp/neptune-src
          git remote add origin https://github.com/devopsfactory-io/neptune.git
          git fetch --depth 1 origin "${{ steps.neptune-ref.outputs.ref }}"
          git checkout FETCH_HEAD
          go build -o /usr/local/bin/neptune .

      # --- Common steps ---
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"

      - name: Setup Terragrunt
        run: |
          TERRAGRUNT_VERSION="0.75.0"
          curl -sSL "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
          chmod +x /usr/local/bin/terragrunt

      - name: Run Neptune
        run: neptune command ${{ github.event.client_payload.command }}
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_PULL_REQUEST_NUMBER: ${{ github.event.client_payload.pull_request_number }}
          GITHUB_PULL_REQUEST_BRANCH: ${{ github.event.client_payload.pull_request_branch }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERRAGRUNT_TFPATH: tofu
